---
name: Test and Publish
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: run-tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
      != github.event.pull_request.base.repo.full_name
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Install a specific version of uv.
          version: 0.9.15
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: |
          uv run poe tests
          uv run poe tests-report
      - name: Static type check
        run: uv run poe type-check
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.python-version == '3.10'
  publish:
    name: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC trusted publishing — no PyPI token needed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git tags
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Install a specific version of uv.
          version: 0.9.15
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install
      - name: Build sdist and wheel
        run: uv build
      - name: Guard namespace integrity
        run: |
          python - <<'EOF'
          import glob, zipfile, sys
          bad = False
          for whl in glob.glob("dist/*.whl"):
              names = zipfile.ZipFile(whl).namelist()
              if "swiss_ai_hub/__init__.py" in names:
                  print(f"::error::{whl} ships swiss_ai_hub/__init__.py — breaks the namespace")
                  bad = True
              if not any(n.startswith("swiss_ai_hub/jambo/") for n in names):
                  print(f"::error::{whl} missing swiss_ai_hub/jambo/")
                  bad = True
          sys.exit(1 if bad else 0)
          EOF
      - name: Publish to PyPI (OIDC trusted publishing)
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
