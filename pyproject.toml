[project]
name = "swiss-ai-hub-jambo"
dynamic = ["version"]
description = "JSON Schema to Pydantic converter — Swiss AI Hub fork of jambo (adds binary and file-path string format support). Imports as swiss_ai_hub.jambo."
requires-python = ">=3.10,<4.0"
authors = [
    { name = "Vitor Hideyoshi", email = "vitor.h.n.batista@gmail.com" },
]
maintainers = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
]
classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",

    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
readme = "README.md"

# Project Dependencies
dependencies = [
    "email-validator>=2.2.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.12.4",
]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "mypy>=1.18.1",
    "poethepoet>=0.33.1",
    "pre-commit>=4.2.0",
    "ruff>=0.11.4",
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-rtd-theme>=3.0.2",
    "types-jsonschema>=4.25.1.20250822",
]


[project.urls]
Homepage = "https://github.com/bbvch-ai/jambo"
Repository = "https://github.com/bbvch-ai/jambo.git"
Upstream = "https://github.com/HideyoshiNakazone/jambo"


# POE Tasks
[tool.poe.tasks]
create-hooks        = "bash .githooks/set-hooks.sh"
tests               = "python -m coverage run -m unittest discover -v"
tests-report        = "python -m coverage xml"
type-check          = "mypy swiss_ai_hub/jambo"
serve-docs          = "sphinx-autobuild docs/source docs/build"

# Build System
[tool.hatch.version]
source = "vcs"

# Ship the package under the shared swiss_ai_hub namespace (PEP 420 native namespace:
# no swiss_ai_hub/__init__.py is bundled, so it coexists with the other swiss_ai_hub.* dists).
# `only-include` keeps the full swiss_ai_hub/jambo path in the wheel; `packages` would strip
# the swiss_ai_hub parent and ship a bare top-level `jambo`.
[tool.hatch.build.targets.wheel]
only-include = ["swiss_ai_hub/jambo"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


# Tests
[tool.coverage.run]
omit = [
    "tests/*",
]



# Linters
[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["swiss_ai_hub"]
section-order=[
    "future",
    "first-party",
    "local-folder",
    "third-party",
    "standard-library",
]
lines-after-imports = 2


[tool.pyright]
venvPath = "."
venv = ".venv"

# swiss_ai_hub is a PEP 420 native namespace (no __init__.py), so anchor the package base at
# the repo root — otherwise mypy walks up to swiss_ai_hub/ and double-discovers files as both
# `jambo.*` and `swiss_ai_hub.jambo.*`.
[tool.mypy]
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
